name: Auto Sync Upstream & Build

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    if: github.event.repository.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync from k1tbyte/Wand-Enhancer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/k1tbyte/Wand-Enhancer.git
          git fetch upstream
          git merge upstream/master --no-edit
          git push origin HEAD

      - name: Trigger Build executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build.yml --repo ${{ github.repository }} --ref master
