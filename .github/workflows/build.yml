name: Build executable

on:
  workflow_dispatch:
    inputs:
      enable_update_notifications:
        description: Include GitHub release checks when Wand starts
        type: boolean
        required: false
        default: false
  pull_request:
  push:
    branches: [master, 'feature/rc_*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # ← 唯一改动点 1：read → write

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.17.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-panel/pnpm-lock.yaml

      - name: Build unsigned executable
        shell: pwsh
        run: |
          if ('${{ inputs.enable_update_notifications }}' -eq 'true') {
            ./build.ps1 -Configuration Release -EnableUpdateNotifications
          } else {
            ./build.ps1 -Configuration Release
          }

      - name: Upload unsigned executable
        uses: actions/upload-artifact@v6
        with:
          name: WandEnhancer-unsigned
          path: WandEnhancer/bin/Release/WandEnhancer.exe
          if-no-files-found: error

# ===== 自动发布 Latest Release =====
      - name: Extract version from project
        id: version
        shell: pwsh
        run: |
          $csproj = Get-Content WandEnhancer/WandEnhancer.csproj -Raw
          if ($csproj -match '<Version>([^<]+)</Version>') {
            $ver = $matches[1]
          } elseif ($csproj -match '<AssemblyVersion>([^<]+)</AssemblyVersion>') {
            $ver = $matches[1]
          } else {
            $ver = "2.1.0.0"
          }
          Write-Host "Version: $ver"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $content = Get-Content CHANGELOG.md -Raw
          # 匹配 ## [2.1.0.0] 到下一个 ## 之间的内容
          $pattern = "##\s*\[$version\][\s\S]*?(?=##\s*\[|$)"
          $match = [regex]::Match($content, $pattern)
          if ($match.Success) {
            $body = $match.Value -replace "##\s*\[$version\]\s*", ""
          } else {
            $body = "See commit history for changes."
          }
          $body = $body.Trim()
          # 写多行输出
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "changelog<<__EOF__" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          "__EOF__" >> $env:GITHUB_OUTPUT

      - name: Package executable
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Compress-Archive -Path "WandEnhancer/bin/Release/*" `
            -DestinationPath "$dist/WandEnhancer-x64-v$version.zip" -Force
          Write-Host "Packed: $dist/WandEnhancer-x64-v$version.zip"

      - name: Publish to latest release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: WandEnhancer ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            dist/WandEnhancer-x64-v${{ steps.version.outputs.version }}.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # ===== 结束 =====

      - name: Verify opt-in update notifications build
        shell: pwsh
        run: ./build.ps1 -Configuration Release -EnableUpdateNotifications
