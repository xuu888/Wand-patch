name: Watch Upstream and Build

on:
  schedule:
    - cron: '37 */6 * * *'   # 每 6 小时检查一次
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Get upstream HEAD
        id: upstream
        run: |
          SHA=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/k1tbyte/Wand-Enhancer/commits?per_page=1" \
            | grep -m1 '"sha"' | cut -d '"' -f4)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Upstream HEAD: $SHA"

      - name: Get last built SHA
        id: last
        continue-on-error: true
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/${{ github.repository }}/main/.last-upstream-sha" \
            > /tmp/last.txt || echo "" > /tmp/last.txt
          echo "sha=$(cat /tmp/last.txt)" >> "$GITHUB_OUTPUT"

      - name: Check changed
        id: decide
        run: |
          if [ "${{ steps.upstream.outputs.sha }}" != "${{ steps.last.outputs.sha }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Build executable
        if: steps.decide.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "Build executable" --repo ${{ github.repository }} --ref ${{ github.ref_name }}

      - name: Save last upstream SHA
        if: steps.decide.outputs.changed == 'true'
        run: |
          echo "${{ steps.upstream.outputs.sha }}" > .last-upstream-sha
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .last-upstream-sha
          git commit -m "chore: record upstream ${{ steps.upstream.outputs.sha }}"
          git push
